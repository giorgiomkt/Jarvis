plugins { id 'com.android.application' }
android {
    namespace 'app.jarvis.pantera'
    compileSdk 34
    defaultConfig {
        applicationId 'app.jarvis.pantera'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName "1.0." + (System.getenv('VERSION_CODE') ?: '1')
    }
    signingConfigs {
        release {
            storeFile file('jarvis.keystore')
            storePassword 'pantera-negra'
            keyAlias 'jarvis'
            keyPassword 'pantera-negra'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
