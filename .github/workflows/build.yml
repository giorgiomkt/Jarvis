name: Build JARVIS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --console=plain 2>&1 | tee build.log || {
            grep -E "error:|\.java:[0-9]+|What went wrong|Could not|Execution failed|> " build.log | grep -v "^> Task" | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1; }
      - name: Renomear
        run: cp app/build/outputs/apk/release/app-release.apk JARVIS.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS
          path: JARVIS.apk
      - name: Publicar APK no branch apk
        run: |
          mkdir -p /tmp/pub && cp JARVIS.apk /tmp/pub/ && cd /tmp/pub
          echo "versão ${{ github.run_number }} · ${{ github.sha }}" > VERSAO.txt
          git init -q -b apk && git add -A
          git -c user.email=actions@github.com -c user.name="JARVIS CI" commit -qm "JARVIS.apk build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk
